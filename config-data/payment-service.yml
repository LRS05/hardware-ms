server:
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

internal:
  auth:
    api-key: ${PAYMENT_SERVICE_API_KEY}
  clients:
    order-service:
      api-key: ${ORDER_SERVICE_API_KEY}
      permissions:
        - PAYMENT_CREATE
        - PAYMENT_CANCEL

mercado-pago:
  access-token: ${MERCADO_PAGO_ACCESS_TOKEN}
  webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET}
