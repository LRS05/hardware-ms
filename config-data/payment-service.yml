server:
  port: 8084

spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

internal:
  auth:
    api-key: ${PAYMENT_SERVICE_API_KEY}

jwt:
  secret-key: $JWT_SECRET_KEY}
