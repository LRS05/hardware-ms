server:
  port: 8083

spring:
  application:
    name: order-service

  datasource:
    url: ${ORDER_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION}

internal:
  auth:
    api-key: ${ORDER_SERVICE_API_KEY}
  clients:
    payment-service:
      apikey: ${PAYMENT_SERVICE_API_KEY}
      permissions:
        - ORDER_COMPLETE
