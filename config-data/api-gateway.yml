server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**,/api/v1/admin/**
              filters:
                - JwtPropagation

            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**
              filters:
                - JwtPropagation

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - JwtPropagation

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret-key: ${JWT_SECRET_KEY}

logging:
  level:
    root: INFO