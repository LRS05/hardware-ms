# Disable external services
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# Database schema managed by Flyway and validated by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT configuration for testing
jwt.secret-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.access.expiration=900000
jwt.refresh.expiration=86400000

# Internal clients for testing
internal.clients.order-service.api-key=test-order-service-key
internal.clients.order-service.permissions[0]=PRODUCT_READ
internal.clients.order-service.permissions[1]=STOCK_INCREASE
internal.clients.order-service.permissions[2]=STOCK_DECREASE

internal.clients.read-only.api-key=test-read-only-key
internal.clients.read-only.permissions[0]=PRODUCT_READ
