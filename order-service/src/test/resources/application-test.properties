# Disable external services
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

# Database schema managed by Flyway and validated by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT configuration for testing
jwt.secret-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
jwt.access.expiration=900000
jwt.refresh.expiration=86400000

# Internal authentication for testing
internal.auth.api-key=test-order-service-key
internal.clients.payment-service.api-key=test-payment-service-key
internal.clients.payment-service.permissions[0]=ORDER_READ
internal.clients.payment-service.permissions[1]=ORDER_COMPLETE
